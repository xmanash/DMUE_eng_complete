version: '3.8'

services:
  dmue-api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${UVICORN_WORKERS:-1}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      PROJECT_NAME: Dynamic Micro-Underwriting Engine
      DMUE_ENV: ${DMUE_ENV:-local}
      CHROMA_PERSIST_DIR: /app/data/chroma_db
      DMUE_API_KEY: ${DMUE_API_KEY:-}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:8501}
      SENTINEL_LIVE_FETCH: ${SENTINEL_LIVE_FETCH:-false}
      SENTINEL_CLIENT_ID: ${SENTINEL_CLIENT_ID:-}
      SENTINEL_CLIENT_SECRET: ${SENTINEL_CLIENT_SECRET:-}
      SENTINEL_API_TOKEN: ${SENTINEL_API_TOKEN:-}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 20s
    restart: always

  dmue-dashboard:
    build: .
    container_name: dmue_dashboard
    command: streamlit run app/ui/dashboard.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      dmue-api:
        condition: service_healthy
    environment:
      DMUE_API_URL: http://dmue-api:8000
      DMUE_ENV: ${DMUE_ENV:-local}
      DMUE_API_KEY: ${DMUE_API_KEY:-}
    restart: always

  dmue-mcp:
    build: .
    container_name: dmue_mcp_server
    command: python -m app.mcp_server.server
    stdin_open: true
    tty: true
    profiles:
      - mcp
    restart: always
