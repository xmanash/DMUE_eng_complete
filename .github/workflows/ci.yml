name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DMUE_ENV: ci
      CHROMA_PERSIST_DIR: ./data/chroma_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Pytest
        run: python -m pytest tests/ -q
      - name: Harness
        run: python -m app.harness
